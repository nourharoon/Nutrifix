<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriFix | أخصائي التغذية الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>نوتريفيكس | NutriFix</h1>
            <p>
                <strong>أخصائي التغذية الذكي</strong><br>
                  يقوم بتحليل بياناتك الحيوية واقتراح الوجبات المناسبة لاحتياجك الغذائي اليومي
            </p>
        </header>

        <main class="input-form">
            <div class="input-group">
                <label>الوزن (كغ)</label>
                <input type="number" id="weight" placeholder="مثال: 70">
            </div>
            
            <div class="input-group">
                <label>الطول (سم)</label>
                <input type="number" id="height" placeholder="مثال: 175">
            </div>

            <div class="input-group">
                <label>العمر</label>
                <input type="number" id="age" placeholder="مثال: 25">
            </div>

            <div class="input-group">
                <label>الجنس</label>
                <select id="gender">
                    <option value="male">ذكر</option>
                    <option value="female">أنثى</option>
                </select>
            </div>

            <div class="input-group">
                <label>مستوى النشاط البدني</label>
                <select id="activity">
                    <option value="1.2">خامل (بدون تمرين)</option>
                    <option value="1.375">نشاط خفيف (1-3 أيام)</option>
                    <option value="1.55">نشاط متوسط (3-5 أيام)</option>
                    <option value="1.725">نشاط عالي (تمرين يومي)</option>
                </select>
            </div>

            <button onclick="processData()">تحليل المعلومات وإظهار النظام الغذائي</button>
        </main>

        <section id="results" class="results-area" style="display:none;">
            <div id="stats-summary"></div>
            <div id="meal-output"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
